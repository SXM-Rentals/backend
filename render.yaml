# WHAT THIS FILE DOES: Describes how the API runs on Render, so the setup lives
# in the repository and is reviewed like code rather than being clicked
# together in a dashboard and forgotten.
#
# IT IS ON RENDER'S FREE PLAN FOR NOW, while there are no real customers. That
# has three consequences worth knowing:
#
#   1. The API goes to sleep after about 15 minutes with no requests, and the
#      first request after that takes up to a minute while it wakes.
#   2. The free plan has no separate "before going live" step, so the
#      migrations run at the start of the start command instead. If one fails,
#      the server never starts, the new version never goes live, and Render
#      keeps serving the last one that worked — the same safety as before.
#      Running them on every start is harmless: when the database is already
#      up to date it is a single quick check.
#   3. The free plan has no scheduled jobs, so the daily job runs on GitHub
#      instead (.github/workflows/daily-tasks.yml).
#
# AT LAUNCH, move to the paid plan: change "plan: free" to "plan: starter",
# move the migration into a preDeployCommand, and the API stops sleeping.
#
# NO SECRET IS IN THIS FILE. Everything sensitive is marked "sync: false",
# which means Render asks for the value once and keeps it.

services:
  - type: web
    name: sxm-rentals-api
    runtime: node
    plan: free
    region: ohio
    branch: main
    # --include=dev: NODE_ENV=production below is also set during the build,
    # and without this npm would skip the TypeScript compiler the build needs.
    buildCommand: npm ci --include=dev && npm run build
    # Bring the database up to date, and only start serving if that worked.
    startCommand: node dist/db/migrate.js && npm start
    # Render restarts the service if this stops answering. It checks the
    # database too, so a server that cannot reach Neon is treated as unhealthy.
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        # Render routes to the container's own address, not localhost.
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        # Render puts one proxy in front of the service. This is what lets the
        # rate limiter see each visitor's real address.
        value: 1
      - key: LOG_LEVEL
        value: info
      # ---- ADDRESSES: set in the Render dashboard ----
      # The website is live at https://www.sxmrentals.app (the bare
      # sxmrentals.app redirects to it), so that is the canonical host.
      #
      # THE API BELONGS ON api.sxmrentals.app, added under this service's
      # Settings -> Custom Domains, not on its …onrender.com address. Not for
      # tidiness: the session cookie carries the __Host- prefix and
      # SameSite=Lax, so a browser will not send it from the website to an API
      # on a different domain — signing in on the website cannot work at all
      # across onrender.com. Under the same domain the two are "same-site",
      # the cookie travels, and no proxy or workaround is needed.
      #
      # APP_URL: the customer website, used for links inside emails. Use the
      # www host, with no trailing slash: https://www.sxmrentals.app
      - key: APP_URL
        sync: false
      # CORS_ORIGINS: the only sites allowed to call this API from a browser,
      # comma separated, all https. Left empty, no browser site can call it
      # (the phone app is unaffected — it is not a browser). Today:
      # https://www.sxmrentals.app plus the admin panel's own address.
      - key: CORS_ORIGINS
        sync: false
      # ---- SECRETS: set in the Render dashboard, never in this file ----
      # RESEND_API_KEY: without it, no email is sent at all — the server writes
      # a loud warning to the logs instead of quietly dropping it.
      - key: RESEND_API_KEY
        sync: false
      # EMAIL_FROM: who emails appear to come from. Until a domain is verified
      # in Resend, leave it unset: the code falls back to Resend's shared test
      # address, which only delivers to the Resend account owner's own inbox.
      - key: EMAIL_FROM
        sync: false
      # EMAIL_REPLY_TO: where replies go, if that should differ from the sender.
      - key: EMAIL_REPLY_TO
        sync: false
      # The social accounts in every email's footer. Each stays plain words
      # until its address is set here, so no email ever carries a dead link.
      - key: SOCIAL_TIKTOK_URL
        sync: false
      - key: SOCIAL_INSTAGRAM_URL
        sync: false
      - key: SOCIAL_FACEBOOK_URL
        sync: false
      # EMAIL_LOGO_URL: the logo drawn at the top of every email. It must load
      # WITHOUT signing in, so it cannot point at a Vercel site that still has
      # deployment protection switched on — readers would see the words
      # "SXM Rentals" instead of the image.
      - key: EMAIL_LOGO_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # Cloudinary, where car photos are kept. The secret signs each upload,
      # so a business can only upload into the folder for its own car.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Addresses allowed to reach the admin panel. Leave unset for none.
      - key: ADMIN_IP_ALLOWLIST
        sync: false
      # Which features the phone app may show: comma separated names, or
      # "all". Changing it needs no new app release — that is the point.
      - key: FEATURES
        sync: false
      - key: FEATURES_OFF
        sync: false
      # "staff" or "stripe" — how identity checks are made once switched on.
      - key: IDENTITY_METHOD
        sync: false
      # "off" puts newly added cars on the site without staff approval. Testing only.
      - key: VEHICLE_APPROVAL
        sync: false
      # Expo's access token. The only thing that lets a push go out as SXM Rentals.
      - key: EXPO_ACCESS_TOKEN
        sync: false
