# WHAT THIS FILE DOES: Describes how the API runs on Render, so the setup lives
# in the repository and is reviewed like code rather than being clicked
# together in a dashboard and forgotten.
#
# IT IS ON RENDER'S FREE PLAN FOR NOW, while there are no real customers. That
# has three consequences worth knowing:
#
#   1. The API goes to sleep after about 15 minutes with no requests, and the
#      first request after that takes up to a minute while it wakes.
#   2. The free plan has no separate "before going live" step, so the
#      migrations run at the start of the start command instead. If one fails,
#      the server never starts, the new version never goes live, and Render
#      keeps serving the last one that worked — the same safety as before.
#      Running them on every start is harmless: when the database is already
#      up to date it is a single quick check.
#   3. The free plan has no scheduled jobs, so the daily job runs on GitHub
#      instead (.github/workflows/daily-tasks.yml).
#
# AT LAUNCH, move to the paid plan: change "plan: free" to "plan: starter",
# move the migration into a preDeployCommand, and the API stops sleeping.
#
# NO SECRET IS IN THIS FILE. Everything sensitive is marked "sync: false",
# which means Render asks for the value once and keeps it.

services:
  - type: web
    name: sxm-rentals-api
    runtime: node
    plan: free
    region: ohio
    branch: main
    # --include=dev: NODE_ENV=production below is also set during the build,
    # and without this npm would skip the TypeScript compiler the build needs.
    buildCommand: npm ci --include=dev && npm run build
    # Bring the database up to date, and only start serving if that worked.
    startCommand: node dist/db/migrate.js && npm start
    # Render restarts the service if this stops answering. It checks the
    # database too, so a server that cannot reach Neon is treated as unhealthy.
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        # Render routes to the container's own address, not localhost.
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        # Render puts one proxy in front of the service. This is what lets the
        # rate limiter see each visitor's real address.
        value: 1
      - key: LOG_LEVEL
        value: info
      # ---- ADDRESSES: set in the Render dashboard ----
      # There is no domain yet, so these are the free addresses Vercel gives
      # the website and admin panel (…vercel.app). Set them there, and change
      # them once a real domain exists — no code change needed either time.
      #
      # APP_URL: the customer website, used for links inside emails.
      - key: APP_URL
        sync: false
      # CORS_ORIGINS: the only sites allowed to call this API from a browser,
      # comma separated, all https. Left empty, no browser site can call it
      # (the phone app is unaffected — it is not a browser).
      - key: CORS_ORIGINS
        sync: false
      # ---- SECRETS: set in the Render dashboard, never in this file ----
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Addresses allowed to reach the admin panel. Leave unset for none.
      - key: ADMIN_IP_ALLOWLIST
        sync: false
